name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: move-vectormath-documentation
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.ref_name }} documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          path: source

      - name: Check out persistent Pages site
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes doxygen

      - name: Select published version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            version=main
          elif [[ "${GITHUB_REF_NAME}" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            version="${GITHUB_REF_NAME}"
          else
            echo "Unsupported documentation tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          echo "name=${version}" >> "${GITHUB_OUTPUT}"

      - name: Prepare version destination
        run: >
          python3 source/tools/docs/versioned_site.py prepare
          --site site
          --version "${{ steps.version.outputs.name }}"

      - name: Build API documentation
        env:
          MV_DOC_SOURCE: ${{ github.workspace }}/source
          MV_DOC_OUTPUT: ${{ github.workspace }}/site/${{ steps.version.outputs.name }}
          MV_DOC_VERSION: ${{ steps.version.outputs.name }}
        run: doxygen source/docs/Doxyfile

      - name: Update version index
        run: python3 source/tools/docs/versioned_site.py index --site site

      - name: Publish Pages branch
        working-directory: site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Documentation is already current."
            exit 0
          fi
          git commit -m "Publish ${{ steps.version.outputs.name }} documentation"
          git push origin HEAD:gh-pages
